name = "nightdesk-api"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Not secrets. The Gemini key is set separately with `wrangler secret put`.
FIREBASE_PROJECT_ID = "nightdesk-journal-cbb89"

# Comma-separated allowlist. The Worker echoes the caller's Origin only if it
# appears here, and sends no CORS header at all when this is unset (default deny).
# No trailing slashes: a browser Origin header never has one, and the comparison
# is exact. Add "http://localhost:5173" while developing against the live Worker.
ALLOWED_ORIGINS = "https://nightdesk-journal-cbb89.web.app"
